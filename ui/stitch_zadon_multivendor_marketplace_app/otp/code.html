<script>
  (function initOTPBehavior() {
    var timerDisplay = document.getElementById('countdown-timer');
    var resendBtn = document.getElementById('resend-btn');
    var timeLeft = 48;

    var timer = setInterval(function() {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(timer);
        if (timerDisplay) {
          timerDisplay.textContent = '00:00';
        }
        if (resendBtn) {
          resendBtn.removeAttribute('disabled');
          resendBtn.classList.remove('text-outline', 'opacity-60', 'cursor-not-allowed');
          resendBtn.classList.add('text-primary', 'bg-primary-fixed/40', 'hover:bg-primary-fixed', 'cursor-pointer');
        }
      } else {
        var formatted = (timeLeft < 10 ? '0' : '') + timeLeft;
        if (timerDisplay) {
          timerDisplay.textContent = '00:' + formatted;
        }
      }
    }, 1000);

    var inputs = document.querySelectorAll('.otp-input');
    inputs.forEach(function(input, index) {
      input.addEventListener('keyup', function(e) {
        if (e.key >= '0' && e.key <= '9') {
          if (index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        } else if (e.key === 'Backspace') {
          if (index > 0 && !input.value) {
            inputs[index - 1].focus();
          }
        }
      });
    });
  })();
</script></main>
