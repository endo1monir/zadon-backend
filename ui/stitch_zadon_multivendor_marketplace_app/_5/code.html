<script>
  (function() {
    const textarea = document.getElementById('ticket-message');
    const counter = document.getElementById('char-counter');
    const fileInput = document.getElementById('file-attachment');
    const filePreview = document.getElementById('file-preview');
    const fileName = document.getElementById('file-name');
    const form = document.getElementById('support-ticket-form');
    const successAlert = document.getElementById('success-alert');

    if (textarea && counter) {
      textarea.addEventListener('input', function() {
        const length = this.value.length;
        counter.textContent = length + ' / 500';
      });
    }

    if (fileInput) {
      fileInput.addEventListener('change', function(e) {
        if (this.files && this.files[0]) {
          fileName.textContent = this.files[0].name;
          filePreview.classList.remove('hidden');
          filePreview.classList.add('flex');
        }
      });
    }

    window.removeAttachment = function(e) {
      e.stopPropagation();
      e.preventDefault();
      if (fileInput) fileInput.value = '';
      if (filePreview) {
        filePreview.classList.remove('flex');
        filePreview.classList.add('hidden');
      }
    };

    window.handleTicketSubmit = function() {
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75');
      submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> جاري الإرسال...';

      setTimeout(function() {
        form.reset();
        counter.textContent = '0 / 500';
        if (filePreview) {
          filePreview.classList.remove('flex');
          filePreview.classList.add('hidden');
        }
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75');
        submitBtn.innerHTML = '<span>إرسال الاستفسار</span><span class="material-symbols-outlined text-[20px] rotate-180">send</span>';
        
        successAlert.classList.remove('hidden');
        successAlert.classList.add('flex');
        successAlert.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 900);
    };
  })();
</script></main>
