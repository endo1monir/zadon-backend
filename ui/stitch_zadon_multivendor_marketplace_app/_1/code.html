<script>
  const ratings = { store: 5, courier: 5 };
  const ratingLabels = ['سيء جداً', 'يحتاج تحسين', 'جيد', 'جيد جداً', 'ممتاز ومثالي'];

  function setRating(target, score) {
    ratings[target] = score;
    const container = document.getElementById(`${target}-stars`);
    const buttons = container.querySelectorAll('button');
    const label = document.getElementById(`${target}-rating-label`);
    
    buttons.forEach((btn, idx) => {
      const icon = btn.querySelector('span');
      if (idx < score) {
        icon.classList.remove('text-surface-container-highest');
        icon.classList.add('text-secondary-container');
        icon.style.fontVariationSettings = "'FILL' 1";
      } else {
        icon.classList.remove('text-secondary-container');
        icon.classList.add('text-surface-container-highest');
        icon.style.fontVariationSettings = "'FILL' 0";
      }
    });

    if (label) {
      label.textContent = ratingLabels[score - 1];
    }
  }

  function toggleTag(el) {
    const isSelected = el.classList.contains('bg-primary');
    if (isSelected) {
      el.classList.remove('bg-primary', 'text-on-primary');
      el.classList.add('bg-surface-container', 'text-on-surface-variant');
    } else {
      el.classList.remove('bg-surface-container', 'text-on-surface-variant');
      el.classList.add('bg-primary', 'text-on-primary');
    }
  }

  function submitReview() {
    const overlay = document.getElementById('success-overlay');
    overlay.classList.remove('hidden');
  }
</script></main>
