<!-- Dynamic Decorative Visual Header (Tactile Fresh Delivery Vibe) -->
<div class="relative w-full rounded-xl overflow-hidden bg-surface-container-low mt-space-sm p-space-lg shadow-sm"><div class="flex flex-col items-center text-center py-space-sm"><div class="w-16 h-16 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center mb-space-md text-primary"><span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">local_mall</span></div><h1 class="font-headline-lg text-headline-lg-mobile text-on-surface">تسجيل الدخول</h1><p class="font-body-md text-body-md text-on-surface-variant mt-1">أدخل رقم جوالك لتسجيل الدخول أو إنشاء حساب</p></div></div>
<!-- Main Login Card (Modern Tactile Container) -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-md p-space-lg mt-space-md flex flex-col">
<!-- Section Label -->
<div class="flex items-center justify-between mb-space-sm">
<label class="font-headline-sm text-headline-sm text-on-surface" for="sa-phone-input">
        رقم الجوال
      </label>
<span class="font-body-sm text-body-sm text-on-surface-variant">
        دخول أو حساب جديد
      </span>
</div>
<!-- Phone Input Interactive Component -->
<div class="flex items-center w-full bg-surface-container-low rounded-xl px-space-md py-space-sm transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<!-- Saudi Flag & Country Code Badge -->
<div class="flex items-center gap-1.5 shrink-0 pl-space-sm">

<span class="font-price-md text-price-md text-on-surface font-semibold tracking-tight" dir="ltr">
          +966
        </span>
</div>
<!-- Vertical Soft Separator -->
<div class="w-px h-6 bg-outline-variant mx-space-xs"></div>
<!-- Phone Text Field -->
<input class="w-full bg-transparent font-price-md text-price-md text-on-surface placeholder:text-outline text-left outline-none" dir="ltr" id="sa-phone-input" inputmode="numeric" maxlength="12" oninput="handlePhoneInput(this)" placeholder="05X XXX XXXX" type="tel">
</div>
<!-- Live Validation Helper -->
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1.5 px-space-xs flex items-center gap-1" id="phone-feedback">
<span class="material-symbols-outlined text-[14px]">sms</span>
      سنرسل إليك رمز تفعيل مكون من 4 أرقام
    </p>
<!-- Primary Action: Send OTP Button -->
<button class="w-full h-12 mt-space-lg rounded-xl bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-transform" id="send-otp-btn" onclick="simulateOtpTrigger()" type="button">
<span id="btn-text" class="">إرسال رمز التحقق (OTP)</span>
<span class="material-symbols-outlined text-[20px] rotate-180">arrow_forward</span>
</button>
</div>
<!-- Visual Divider with Soft Pill Label -->

<div class="w-full h-px bg-surface-container-high"></div>

</div>

<!-- Continue as Guest -->

</div>
<!-- Fresh Categorical Quick Highlights -->

<!-- Legal & Terms Footer Disclaimer -->
<div class="mt-space-xl text-center px-space-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
      بالاستمرار، أنت توافق على 
      <a class="text-primary font-semibold hover:underline" href="javascript:void(0)">شروط الخدمة</a>
      و

      لتطبيق زادون السعودية.
    </p>
<div class="flex items-center justify-center gap-1 text-on-surface-variant/70 mt-space-sm">
<span class="material-symbols-outlined text-[15px]">lock</span>
<span class="font-label-sm text-label-sm">بياناتك مشفرة ومحمية بالكامل</span>
</div>
</div>
<!-- Toast Notification Template -->
<div class="fixed bottom-6 right-1/2 translate-x-1/2 z-50 px-space-md py-space-sm rounded-xl bg-inverse-surface text-inverse-on-surface font-body-sm text-body-sm shadow-xl flex items-center gap-2 transition-opacity duration-300 opacity-0 pointer-events-none" id="quick-toast">
<span class="material-symbols-outlined text-[18px] text-primary-fixed">info</span>
<span id="toast-msg" class="">يرجى إدخال رقم هاتف سعودي صحيح للمتابعة</span>
</div>
</div>
<script>
  function handlePhoneInput(input) {
    let val = input.value.replace(/\D/g, '');
    
    // Normalize leading zeros if present
    if (val.startsWith('966')) {
      val = val.substring(3);
    }
    
    // Formatting: 05X XXX XXXX
    let formatted = '';
    if (val.length > 0) {
      formatted += val.substring(0, 3);
      if (val.length > 3) {
        formatted += ' ' + val.substring(3, 6);
      }
      if (val.length > 6) {
        formatted += ' ' + val.substring(6, 10);
      }
    }
    
    input.value = formatted;

    const feedback = document.getElementById('phone-feedback');
    const cleanedDigits = val.replace(/\s/g, '');
    
    if (cleanedDigits.length >= 9 && cleanedDigits.startsWith('05') || (cleanedDigits.length >= 8 && cleanedDigits.startsWith('5'))) {
      feedback.innerHTML = '<span class="material-symbols-outlined text-[15px] text-primary" style="font-variation-settings: \\\'FILL\\\' 1;">check_circle</span> <span class="text-primary font-medium">رقم سعودي صالح وجاهز للإرسال</span>';
    } else if (cleanedDigits.length > 0) {
      feedback.innerHTML = '<span class="material-symbols-outlined text-[15px] text-on-surface-variant">info</span> <span>الرجاء كتابة الرقم بصيغة 05xxxxxxxx</span>';
    } else {
      feedback.innerHTML = '<span class="material-symbols-outlined text-[14px]">sms</span> <span>سنرسل إليك رمز تفعيل مكون من 4 أرقام</span>';
    }
  }

  function showToast(message) {
    const toast = document.getElementById('quick-toast');
    const label = document.getElementById('toast-msg');
    label.innerText = message;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');
    
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }, 2800);
  }

  function simulateOtpTrigger() {
    const input = document.getElementById('sa-phone-input');
    const digits = input.value.replace(/\D/g, '');
    
    if (!digits || digits.length < 9) {
      showToast('يرجى إدخال رقم هاتف سعودي صحيح للمتابعة');
      input.focus();
      return;
    }

    const btnText = document.getElementById('btn-text');
    btnText.innerText = 'جاري الإرسال...';
    
    setTimeout(() => {
      btnText.innerText = 'تم إرسال الرمز بنجاح!';
      showToast('تم إرسال كود التحقق بنجاح إلى ' + input.value);
      setTimeout(() => {
        btnText.innerText = 'إرسال رمز التحقق (OTP)';
      }, 2000);
    }, 800);
  }

  function guestExploreToast() {
    showToast('جاري فتح التطبيق بوضع الزائر للتسوق السريع...');
  }
</script></main>
